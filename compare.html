<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>compare tags — r34 tag trends</title>
<meta name="description" content="Compare two rule34 tags side by side: yearly share, trend and confidence interval.">
<link rel="canonical" href="https://developer01234.github.io/r34-stat/web/compare.html">
<meta name="robots" content="index,follow">
<script src="i18n.js"></script>
<style>
 body{background:#111;color:#ddd;font:13px system-ui;padding:24px;max-width:900px}
 a{color:#6aa8e8} select,button{background:#1b1b1b;color:#ddd;border:1px solid #444;padding:3px}
 svg{width:100%;height:220px;margin-top:18px}
 .a{stroke:#e87bb0}.b{stroke:#5fbf6a}
 table{border-collapse:collapse;margin-top:16px}
 td,th{padding:2px 10px;text-align:left;font-weight:400;border-bottom:1px solid #222}
</style></head><body>
<p><a href="./" data-i18n="dash">← dashboard</a>
 <button onclick="setLang(localStorage.lang==='en'?'ru':'en')">EN / RU</button></p>
<h2 data-i18n="cmp">tag comparison</h2>
<p><select id="sa"></select> <select id="sb"></select></p>
<svg id="cv" viewBox="0 0 700 220" preserveAspectRatio="none"></svg>
<div id="stat"></div>
<script>
let D=null;
fetch('data.json').then(r=>r.json()).then(d=>{
  D=d;
  const opts=d.tags.map(x=>`<option>${x.tag}</option>`).join('');
  sa.innerHTML=opts; sb.innerHTML=opts; sb.selectedIndex=1;
  [sa,sb].forEach(s=>s.onchange=draw);
  window.rerender=draw; draw();
});
function draw(){
  if(!D) return;
  const ta=D.tags.find(x=>x.tag===sa.value), tb=D.tags.find(x=>x.tag===sb.value);
  if(!ta||!tb) return;
  const ys=D.years, peak=Math.max(1e-9,...Object.values(ta.shares),...Object.values(tb.shares));
  const line=(x,cls)=>{
    const pts=ys.map((y,i)=>{
      const v=x.shares[y]||0, px=10+i*(680/(ys.length-1));
      return `${px.toFixed(1)},${(200-(v/peak)*180).toFixed(1)}`;
    }).join(' ');
    return `<polyline points="${pts}" fill="none" stroke-width="2" class="${cls}"/>`;
  };
  cv.innerHTML=line(ta,'a')+line(tb,'b');
  const head=`<tr><th>${t('year')}</th><th style="color:#e87bb0">${ta.tag}</th>`
    +`<th style="color:#5fbf6a">${tb.tag}</th></tr>`;
  const body=ys.map(y=>{
    const va=(ta.shares[y]||0)*100, vb=(tb.shares[y]||0)*100;
    return `<tr><td>${y}</td><td>${va?va.toFixed(2):''}</td><td>${vb?vb.toFixed(2):''}</td></tr>`;
  }).join('');
  stat.innerHTML=`<table>${head}${body}</table>
    <p>${ta.tag}: ${fmtT(ta.trend)}× · ${t('pm')}${(ta.margin*100).toFixed(1)} pp &nbsp;|&nbsp;
    ${tb.tag}: ${fmtT(tb.trend)}× · ${t('pm')}${(tb.margin*100).toFixed(1)} pp &nbsp;|&nbsp;
    ${t('scale')} ${(peak*100).toFixed(1)}%</p>`;
}
</script></body></html>
