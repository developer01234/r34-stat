name: monthly snapshot
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: harvest
        env:
          R34_USER_ID: ${{ secrets.R34_USER_ID }}
          R34_API_KEY: ${{ secrets.R34_API_KEY }}
          R34_RPS: "1"
        run: python -V && python -m r34.harvest --samples 2000 --width 100 --seed ${{ github.run_number }}
      - name: calibrate
        run: python -m r34.calibrate
      - name: aggregate
        run: python -m r34.aggregate --top 300 --min-total 40
      - name: pages
        run: python -m r34.pages --data data.json --out tag --limit 1500
      - name: commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json curve.json slugs.json method.html sitemap.xml badge tag artist character copyright general metadata rising falling
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%F)"
          git push